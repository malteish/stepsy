plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// Single source of truth for the app version. The release workflow greps these two
// lines to derive the artifact names and to locate the matching fastlane changelog,
// so keep the literal `def appVersionCode = <int>` / `def appVersionName = "<str>"` shape.
def appVersionCode = 20
def appVersionName = "1.6.2"

// Release signing is driven entirely by the environment so that CI can sign without
// the keystore ever living in the repository:
//   KEYSTORE_FILE     optional path to the keystore (default: app/keystore.jks)
//   KEYSTORE_PASSWORD store password
//   KEY_ALIAS         key alias
//   KEY_PASSWORD      key password
// When the keystore is absent (contributors, PR builds, F-Droid) release builds still
// assemble, they are just left unsigned instead of failing the whole build.
def keystoreFile = file(System.getenv("KEYSTORE_FILE") ?: "keystore.jks")
def canSignRelease = keystoreFile.exists() &&
        System.getenv("KEYSTORE_PASSWORD") != null &&
        System.getenv("KEY_ALIAS") != null &&
        System.getenv("KEY_PASSWORD") != null

// Names the APKs `stepsy-v<version>-<flavor>-<buildType>.apk` instead of `app-*.apk`,
// so release assets carry their version without a rename step in CI.
base {
    archivesName = "stepsy-v${appVersionName}"
}

android {
    namespace 'com.nvllz.stepsy'
    compileSdk 35
    defaultConfig {
        applicationId "com.nvllz.stepsy"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode appVersionCode
        versionName appVersionName
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    flavorDimensions += "distribution"

    productFlavors {
        create("full") {
            dimension = "distribution"
            buildConfigField "boolean", "HAS_PROPRIETARY_LIBRARIES", "true"
        }
        create("foss") {
            dimension = "distribution"
            buildConfigField "boolean", "HAS_PROPRIETARY_LIBRARIES", "false"
        }
    }
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [icon: "@drawable/ic_launcher_debug"]
            applicationIdSuffix ".debug"
            versionNameSuffix '-debug'
            minifyEnabled false
        }
        release {
            manifestPlaceholders = [icon: "@drawable/ic_launcher"]
            minifyEnabled true
            shrinkResources true
            signingConfig = (canSignRelease ? signingConfigs.release : null)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

}

dependencies {
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.lifecycle:lifecycle-process:2.9.1"


    implementation "androidx.datastore:datastore-preferences:1.1.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.1"
    implementation 'com.google.android.material:material:1.13.0'

    fullImplementation 'com.google.android.gms:play-services-base:18.10.0'
    fullImplementation 'com.google.android.gms:play-services-location:21.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}