# ===================================================================
# Stepsy CI
#
# Validates every push to master and every pull request:
#   1. test:  unit tests for both product flavors
#   2. lint:  Android Lint on both flavors (informational, see the job comment)
#   3. build: debug APKs for both flavors, uploaded as artifacts
#
# Release builds live in `release.yml` and are driven by version tags.
# ===================================================================
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================================================================
  # JOB: test
  #
  # Both flavors are tested because `foss/` and `full/` each ship their own
  # ActivityRecognitionManager; a change to one only breaks the other flavor's
  # compilation, which a single-flavor build would never catch.
  # ===================================================================
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Guards against a tampered gradle-wrapper.jar being executed on the runner.
          validate-wrappers: true
          # Only master writes the shared cache; PR runs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Run unit tests
        run: ./gradlew testFossDebugUnitTest testFullDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  # ===================================================================
  # JOB: lint
  #
  # Android Lint has never gated this repository, so an existing backlog of
  # warnings must not block merges on day one. The job reports findings and
  # uploads the full report, but is marked non-blocking. Drop the
  # `continue-on-error` line once the report is clean to make lint a real gate.
  # ===================================================================
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Run lint on both flavors
        run: ./gradlew lintFossRelease lintFullRelease

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore

  # ===================================================================
  # JOB: build
  #
  # Produces installable debug APKs for manual testing. Debug builds carry the
  # `.debug` application id suffix, so they install alongside a store build.
  # ===================================================================
  build:
    name: Build debug APKs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Assemble debug APKs
        run: ./gradlew assembleFossDebug assembleFullDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: stepsy-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
